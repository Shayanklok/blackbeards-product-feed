name: Update product feed

on:
  schedule:
    # Every 6 hours. ChatGPT re-reads the file once a day.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed from the online store
        run: python build_feed.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blackbeards-products.jsonl blackbeards-products.jsonl.gz feed-report.txt
          if git diff --cached --quiet; then
            echo "No product changes."
          else
            git commit -m "Update product feed"
            git push
          fi
